<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Birthday Surprise</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg-a: #ffdee9;    
    --bg-b: #b5fffc;    
    --accent: #ff4d88;  
    --card-bg: rgba(255,255,255,0.9);
    --text-dark: #222;
  }
  html,body{height:100%;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial; -webkit-font-smoothing:antialiased;}
  body{
    background: linear-gradient(135deg,var(--bg-a) 0%, var(--bg-b) 100%);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    color:var(--text-dark);
    overflow:hidden;
  }

 
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);}
  .card{width:100%;max-width:980px;background:var(--card-bg);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,0.12);position:relative;overflow:hidden}

  /* headers text alignment */
  .hero {text-align:center;padding:12px 8px}
  .hero h1{margin:6px 0;font-size:clamp(22px,5vw,40px);color:var(--accent);letter-spacing:-0.02em}
  .hero p{margin:6px 0 12px 0;color:rgba(0,0,0,0.55)}

  /* three scenes container */
  .scenes{position:relative;min-height:320px}
  .scene{display:none;padding:8px 6px;align-items:center;justify-content:center}
  .scene.active{display:flex}

   .heart {
    position: absolute;
    width: 30px;
    height: 30px;
    background: #ff4d88;
    transform: rotate(45deg);
    animation: float 5s infinite ease-in-out; }
    .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 30px;
    height: 30px;
    background: #ff4d88;
    border-radius: 50%;
  }
  .heart::before { top: -15px; left: 0; }
  .heart::after { left: -15px; top: 0; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0% { transform: translateY(0) rotate(45deg); opacity: 0.8; }
    100% { transform: translateY(-600px) rotate(45deg); opacity: 0.8; }
  }

   .paused {
    animation-play-state: paused !important;
  }
  /* media */
  .media{width:100%;max-width:540px;margin:0 auto;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,0.08)}
  .media img{width:100%;height:100%;object-fit:cover;display:block}

  /* buttons / navigation css */
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .btn{padding:12px 18px;border-radius:999px;border:none;cursor:pointer;font-weight:700;background:linear-gradient(90deg,var(--accent),#ff9fbe);color:white;box-shadow:0 10px 24px rgba(0,0,0,0.12)}
  .btn.ghost{background:transparent;color:var(--text-dark);border:1px solid rgba(0,0,0,0.06)}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .nav-left, .nav-right{display:flex;gap:8px;align-items:center}

  /* overlay (reveal) css */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:80;visibility:hidden;opacity:0;transition:all .25s ease}
  .overlay.show{visibility:visible;opacity:1}
  .popup{background:linear-gradient(180deg,rgba(255,255,255,0.98),rgba(255,255,255,0.95));padding:18px;border-radius:14px;max-width:720px;width:92%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.28)}
  .popup h2{margin:6px 0;color:var(--accent)}
  .popup p{color:rgba(0,0,0,0.65)}

  /* floating hearts (simple) */
  .heart{position:absolute;width:18px;height:18px;background:var(--accent);transform:rotate(45deg);border-radius:3px;opacity:0.95}
  .heart:before,.heart:after{content:"";position:absolute;background:var(--accent);border-radius:50%}
  .heart:before{top:-9px;left:0;width:18px;height:18px}
  .heart:after{top:0;left:-9px;width:18px;height:18px}

  /* footer */
  .footer{display:flex;justify-content:center;gap:10px;margin-top:12px}

  /* responsive tweaks */
  @media(min-width:900px){
    .card{padding:26px}
    .scenes{min-height:420px}
    .hero {padding-bottom:10px}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<!--
  ====== EDIT MARKERS (update these values) ======
  Change the values below inside the SCRIPT block near the top.
  - PERSON_NAME      -> recipient's name (string)
  - MAIN_MESSAGE     -> quote or short message (string)
  - MUSIC_URL        -> direct MP3 URL or empty string "" to disable
  - IMAGE_URL        -> main image or gif URL (opens in new tab on click)
  - THEME_BG_A/B     -> gradient colors (hex)
  =================================================
-->
<script>
 
  const PERSON_NAME = "Candybar"; // ← 🎂 Name
  const MAIN_MESSAGE = "You make life sweeter every day 💖"; // ← 💬 Message / Quote
  const MUSIC_URL = ""; // ← 🎵 Music MP3 URL (put "" to disable)
  const IMAGE_URL = ""; // ← 🖼️ Image or GIF URL (put "" to keep the default sample)
  const THEME_BG_A = "#ffdee9"; // ← theme gradient start (hex)
  const THEME_BG_B = "#b5fffc"; // ← theme gradient end (hex)
  const ACCENT_COLOR = "#ff4d88"; // ← accent color
</script>

<div class="stage">
  <div class="card" id="cardRoot">
    <div class="hero">
      <h1 id="pageTitle">Happy Birthday</h1>
      <p id="pageSubtitle">A little surprise just for you</p>
    </div>

    <div class="scenes">
      <!-- Scene 1: Landing / Intro -->
      <section id="scene1" class="scene active" aria-hidden="false">
        <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
          <div class="media" style="padding:22px;text-align:center;background:transparent;box-shadow:none;">
            <!-- small decorative image (from first design) -->
      
            <img id="sampleImg1" src="https://tenor.com/view/bubu-dudu-love-bubu-dudu-gif-4744117645076411056" alt="celebrate">
          </div>
          <div style="text-align:center;padding:0 8px">
            <div style="font-weight:700;font-size:1.05rem" id="introLine">Ready to surprise <span id="introName"></span>?</div>
            <div style="color:rgba(0,0,0,0.55);margin-top:6px">Tap Begin to open the surprise</div>
            <div class="controls" style="margin-top:12px">
              <button id="beginBtn" class="btn">Click to Begin 🎁</button>
              <button id="muteBtn" class="btn ghost">Play Music ▶️</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Scene 2: Reveal image/GIF with hearts -->
      <section id="scene2" class="scene" aria-hidden="true">
        <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
          <div class="media" id="mediaWrap">
            <a id="openMedia" href="#" target="_blank" rel="noopener noreferrer"><img id="mainMedia" src="" alt="surprise"></a>
          </div>
          <div style="text-align:center">
            <h1 id="revealHeading">Happy Birthday, <span id="nameInline"></span> 💖</h1>
            <p style="color:rgba(0,0,0,0.6)" id="revealSub">Tap image to view full size</p>
            <div class="controls">
              <button id="nextBtn1" class="btn">Next →</button>
              <button id="backBtn1" class="btn ghost">← Back</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Scene 3: Final wish and quote -->
      <section id="scene3" class="scene" aria-hidden="true">
        <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
          <div style="text-align:center;padding:6px 16px">
            <h1 id="finalTitle">Make a wish! 🎂</h1>
            <p id="finalQuote" style="margin-top:10px;color:rgba(0,0,0,0.65);max-width:760px"></p>
            <div class="controls" style="margin-top:14px">
              <button id="saveBtn" class="btn">Save Card 💾</button>
              <button id="backBtn2" class="btn ghost">← Back</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- navigation row (always visible) -->
    <div class="nav-row" style="margin-top:8px">
      <div class="nav-left">
        <button id="navBack" class="btn ghost small">← Back</button>
      </div>
      <div class="nav-right">
        <button id="navNext" class="btn small">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- reveal overlay popup (used to show larger media if needed) -->
<div id="overlay" class="overlay" role="dialog" aria-hidden="true">
  <div class="popup" id="popup">
    <h2 id="popupTitle">Surprise!</h2>
    <p id="popupText">Wishing you a wonderful day.</p>
    <img id="popupImg" src="" alt="surprise" style="max-width:260px;border-radius:10px;margin-top:12px;display:block;margin-left:auto;margin-right:auto">
    <div style="margin-top:12px">
      <button id="closePopup" class="btn">Close</button>
    </div>
  </div>
</div>

<!-- audio element (hidden) -->
<audio id="bgAudio" loop crossorigin="anonymous"><source id="bgSource" src="" type="audio/mpeg"></audio>

<script>
/* ============================
   Initialization - use comment markers at top to edit values
   (You already edited PERSON_NAME, MAIN_MESSAGE, MUSIC_URL, IMAGE_URL, THEME_BG_A/B above)
   ============================ */

(function(){
  // get UI elements
  const introName = document.getElementById('introName');
  const nameInline = document.getElementById('nameInline');
  const revealHeading = document.getElementById('revealHeading');
  const pageTitle = document.getElementById('pageTitle');
  const pageSubtitle = document.getElementById('pageSubtitle');

  // scenes
  const scene1 = document.getElementById('scene1');
  const scene2 = document.getElementById('scene2');
  const scene3 = document.getElementById('scene3');
  const scenes = [scene1, scene2, scene3];
  let current = 0;

  // elements
  const beginBtn = document.getElementById('beginBtn');
  const muteBtn = document.getElementById('muteBtn');
  const nextBtn1 = document.getElementById('nextBtn1');
  const backBtn1 = document.getElementById('backBtn1');
  const backBtn2 = document.getElementById('backBtn2');
  const navBack = document.getElementById('navBack');
  const navNext = document.getElementById('navNext');
  const mainMedia = document.getElementById('mainMedia');
  const openMedia = document.getElementById('openMedia');
  const popup = document.getElementById('overlay');
  const popupImg = document.getElementById('popupImg');
  const popupTitle = document.getElementById('popupTitle');
  const popupText = document.getElementById('popupText');
  const closePopup = document.getElementById('closePopup');
  const saveBtn = document.getElementById('saveBtn');
  const bgAudio = document.getElementById('bgAudio');
  const bgSource = document.getElementById('bgSource');

  // apply theme colors from top script markers
  try {
    document.documentElement.style.setProperty('--bg-a', typeof THEME_BG_A !== 'undefined' ? THEME_BG_A : '#ffdee9');
    document.documentElement.style.setProperty('--bg-b', typeof THEME_BG_B !== 'undefined' ? THEME_BG_B : '#b5fffc');
    document.documentElement.style.setProperty('--accent', typeof ACCENT_COLOR !== 'undefined' ? ACCENT_COLOR : '#ff4d88');
  } catch(e){ /* ignore */ }

  // set texts from personalization
  try {
    const name = PERSON_NAME || "Friend";
    introName.textContent = name;
    nameInline.textContent = name;
    document.getElementById('pageTitle').textContent = `Happy Birthday ${name} 💖`;
    document.getElementById('pageSubtitle').textContent = MAIN_MESSAGE || "";
    document.getElementById('finalQuote').textContent = MAIN_MESSAGE || "";
    document.getElementById('popupTitle').textContent = `Happy Birthday, ${name}!`;
    document.getElementById('popupText').textContent = MAIN_MESSAGE || "";
  } catch(e){ console.warn(e); }

  // set media image (if not provided use a soft default)
  const defaultImg = "";
  mainMedia.src = (typeof IMAGE_URL !== 'undefined' && IMAGE_URL && IMAGE_URL.length>5) ? IMAGE_URL : defaultImg;
  openMedia.href = mainMedia.src;
  document.getElementById('sampleImg1').src = mainMedia.src;

  // audio loading
  if (typeof MUSIC_URL !== 'undefined' && MUSIC_URL && MUSIC_URL.length>4) {
    bgSource.src = MUSIC_URL;
    bgAudio.load();
  } else {
    // hide music button
    muteBtn.style.display = 'none';
  }

  // utility: show scene by index
  function showScene(idx){
    scenes.forEach((s,i)=> {
      if(i===idx){ s.classList.add('active'); s.setAttribute('aria-hidden','false'); }
      else { s.classList.remove('active'); s.setAttribute('aria-hidden','true'); }
    });
    current = idx;
    // update next/back nav text
    if(current === 0){ navBack.style.opacity=0.4; navNext.style.opacity=1; } 
    else if(current === scenes.length-1){ navBack.style.opacity=1; navNext.style.opacity=0.4; }
    else{ navBack.style.opacity=1; navNext.style.opacity=1; }
  }

  // initial
  showScene(0);

  // Begin button -> go to scene 2 (reveal)
  beginBtn.addEventListener('click', function(){
    showScene(1);
    // try start audio (user interaction allows play on iOS)
    bgAudio.play().catch(()=>{ /* autoplay blocked until gesture on some devices; muteBtn will control */ });
    spawnHearts(15);
  });

  // mute / play toggle
  muteBtn.addEventListener('click', function(){
    if(bgAudio.paused){ bgAudio.play().then(()=> muteBtn.textContent = "Pause Music ⏸️").catch(()=>{}); }
    else { bgAudio.pause(); muteBtn.textContent = "Play Music ▶️"; }
  });

  // scene 2 navigation
  nextBtn1.addEventListener('click', function(){
    showScene(2);
    spawnConfetti(48);
  });
  backBtn1.addEventListener('click', function(){ showScene(0); });

  // scene 3 back
  backBtn2.addEventListener('click', function(){ showScene(1); });

  // always-available nav
  navBack.addEventListener('click', function(){ showScene(Math.max(0, current-1)); });
  navNext.addEventListener('click', function(){ showScene(Math.min(scenes.length-1, current+1)); });

  // open popup on image click (shows larger view; also opens in new tab via anchor)
  mainMedia.addEventListener('click', function(e){
    // show popup overlay preview
    popupImg.src = mainMedia.src;
    popup.classList.add('show');
    popup.style.visibility = 'visible';
    popup.style.opacity = 1;
  });
  closePopup.addEventListener('click', function(){ popup.classList.remove('show'); popup.style.visibility='hidden'; popup.style.opacity=0; });

  // save card as png (simple snapshot)
  saveBtn.addEventListener('click', function(){
    const node = document.querySelector('.card');
    const rect = node.getBoundingClientRect();
    const scale = 2;
    const canvas = document.createElement('canvas'); canvas.width = rect.width*scale; canvas.height = rect.height*scale;
    const ctx = canvas.getContext('2d');
    // background fill (use CSS gradient colors as fallback)
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-a') || "#fff0f3";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // draw title
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || "#ff4d88";
    ctx.font = `${30*scale}px sans-serif`; ctx.fillText(document.getElementById('pageTitle').textContent, 20*scale, 60*scale);
    // draw message
    ctx.fillStyle = "#333"; ctx.font = `${16*scale}px sans-serif`; wrapText(ctx, document.getElementById('pageSubtitle').textContent, 20*scale, 100*scale, rect.width*scale - 40*scale, 22*scale);
    // draw main image
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = function(){ ctx.drawImage(img, 20*scale, 140*scale, rect.width*scale - 40*scale, rect.height*scale/2); downloadCanvas(canvas); };
    img.onerror = function(){ downloadCanvas(canvas); };
    img.src = mainMedia.src;
    function downloadCanvas(c){ const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `birthday_${(PERSON_NAME||'card')}.png`; a.click(); }
    function wrapText(ctx, text, x, y, maxW, lineH){ const words = text.split(' '); let line=''; for(let n=0;n<words.length;n++){ const test = line + words[n] + ' '; const m = ctx.measureText(test); if(m.width > maxW && n>0){ ctx.fillText(line, x, y); line = words[n] + ' '; y += lineH; } else { line = test; } } ctx.fillText(line, x, y); }
  });

  // ---- Simple visual helpers: hearts & confetti (mobile-light) ----
  function spawnHearts(n){
    for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.top = window.innerHeight + 'px';
        heart.style.animationDuration = (3 + Math.random() * 3) + 's';
        document.body.appendChild(heart);
        
        setTimeout(() => heart.remove(), 9000);
      }
    
  }

  function spawnConfetti(n){
    for(let i=0;i<n;i++){
      const el = document.createElement('div');
      el.style.position='fixed'; el.style.left = (10 + Math.random()*80) + '%'; el.style.top = '-40px';
      const w = 6 + Math.random()*14; el.style.width = w + 'px'; el.style.height = (w*0.6) + 'px';
      el.style.background = `hsl(${Math.random()*360} 80% 60%)`; el.style.opacity = 0.95; el.style.zIndex=50;
      el.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(el);
      const dur = 3000 + Math.random()*2500;
      el.animate([{transform:`translateY(0) rotate(${Math.random()*360}deg)`, opacity:1},{transform:`translateY(${window.innerHeight + 200}px) rotate(${Math.random()*720}deg)`, opacity:0}], {duration:dur, easing:'cubic-bezier(.2,.8,.2,1)'});
      setTimeout(()=>{ try{ el.remove(); } catch(e){} }, dur+120);
    }
  }

  // allow opening media in new tab by clicking the link (anchor)
  openMedia.addEventListener('click', function(e){
    // default anchor will open; also show popup for preview
    // allow default to proceed
  });

  // small accessibility: keyboard nav (left/right)
  window.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') { navNext.click(); }
    else if(e.key === 'ArrowLeft') { navBack.click(); }
  });

  window.addEventListener('resize', function(){  });

})(); /* end init */
</script>
</body>
</html>
