<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Surprise</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div class="stage">
    <div class="card" id="cardRoot">

      <!-- First Page Header -->
   

      <div class="scenes">
        <!-- first page content-->
        <section id="scene1" class="scene active" aria-hidden="false">
             <div class="hero" id="mainHero">
                <h1 id="heroTitle" style="font-size: 16px;">Hush Hush Surprise Candybar🎁</h1>
                <p id="heroSubtitle" style="font-size: 14px;">A secret mission awaits just for you my 💖</p>
              </div>
          <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
            <div class="media" style="padding:2px;text-align:center;background:transparent;box-shadow:none">
              <img id="sampleImg1" src="assets/images/surprise.jpg" alt="surprise" style="max-width:350px;height:180px;border-radius:16px;">
            </div>

            <div style="text-align:center;padding:0 8px">
              <!-- <div style="font-weight:700;font-size:1.05rem" id="introLine">
                Ready to surprise <span id="introName"></span>?
              </div> -->
              <!-- <div style="color:rgba(0,0,0,0.55);margin-top:6px">
                Hearts will float under Scene 2 once you click Begin
              </div> -->
              <span id="introName"></span>
              <div style="margin-top:10px;text-align:center">
                <!-- <label style="font-size:13px;color:rgba(0,0,0,0.6)">Scheduled enable time (IST):</label>-->
                <div id="scheduleText" style="margin-top:6px;font-weight:600;color:rgba(0,0,0,0.8)"></div> 
                <div style="margin-top:8px">
                  <button id="editTimeBtn" class="btn ghost" style="margin-right:8px" disabled>Edit time</button>
                  <button id="saveTimeBtn" class="btn" style="display:none" >Save time</button>
                </div>
                <input id="scheduleInput" type="datetime-local" class="small-input" style="display:none" />
                <!-- <div style="font-size:12px;color:rgba(0,0,0,0.55)">
                  (Set to 2025-10-31T00:00 IST to enable on 31 Oct 12:00 AM IST)
                </div> -->
              </div>

              <div class="controls" style="margin-top:12px">
                <button id="beginBtn" class="btn" aria-disabled="true" disabled>Click to Reveal🪄</button>
                <button id="stopMusicBtn" class="btn ghost">Stop Music ⏸️</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Scene 2 -->
        <section id="scene2" class="scene" aria-hidden="true">
          <div class="hero">
            <h2 id="scene2Title"  style="color:var(--accent); padding: auto; font-size: 14px;">Happy Birthday My Dear Moon💖</h2>
            <p id="heroSubtitle" style="font-size: 14px;">Hey Candybar, here’s a small virtual gift from Sang Yan! Once again, many more happy returns of the day, Suni💖</p>
       
          </div>
          
          <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
              <div class="media" style="max-width:320px;">
              <a id="openMedia" href="#" target="_blank" rel="noopener noreferrer">
                <img id="mainMedia" src="assets/images/birthday.jpeg"  alt="surprise">
              </a>
            </div>

            <div style="text-align:center;padding:6px 12px">
              <!-- <p id="revealSub" style="color:rgba(0,0,0,0.6);margin-top:8px">Tap image to view full size</p> -->
              <div class="controls">
                <button id="backBtn1" class="btn ghost">← Back</button>
                <button id="toScene3" class="btn">Small Surprise →</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Scene 3 -->
        <section id="scene3" class="scene" aria-hidden="true">
          <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
            <h2 id="scene3Title" style="color:var(--accent);font-size: 14px;">Your Wish Awaits🌠!</h2>

            <div style="width:90%;max-width:640px;margin-top:6px;text-align:center">
              <img id="wishGif" src="assets/images/doa.png" alt="wish" style="max-width:350px;height:180px;border-radius:16px;">
              <p id="giftTextPara" style="margin-top:10px;color:rgba(0,0,0,0.7);font-size:1rem"></p>

              <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
                <button id="saveBtn" class="btn">Save Card 💾</button>
                <button id="backBtn2" class="btn ghost">← Back</button>
              </div>

              <!-- <div style="margin-top:10px;color:rgba(0,0,0,0.6);font-size:13px;text-align:center">
                Saved snapshot contains the image and the read-only gift text.
              </div> -->
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay" role="dialog" aria-hidden="true">
    <div class="popup" id="popup">
      <h2 id="popupTitle">Preview</h2>
      <img id="popupImg" src="" alt="preview" style="max-width:320px;border-radius:10px;display:block;margin:12px auto;">
      <div style="margin-top:12px"><button id="closePopup" class="btn">Close</button></div>
    </div>
  </div>
<audio id="bgAudio" loop>
  <source id="bgSource" src="assets/music/ab.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="main.js"></script>
</body>
</html>
